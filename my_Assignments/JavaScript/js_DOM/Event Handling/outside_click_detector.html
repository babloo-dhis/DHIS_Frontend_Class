<!-- Build a click outside detector for a modal -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            visibility: hidden;
            opacity: 0;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal.open {
            visibility: visible;
            opacity: 1;
        }

        .modal-content {
            background: #fff;
            padding: 2rem;
            border-radius: 8px;
            width: 300px;
            text-align: center;
        }
    </style>

</head>
<body>
    
    <button onclick="openModal()">Modal Open</button>

    <div id="modal" class="modal">
        <div class="modal-content">
            <h2>Modal Window</h2>
            <p>This is Modal Text</p>
            <button onclick="closeModal()">Close Modal Window</button>
        </div>
    </div>

    <script>
        const modal = document.getElementById("modal");
        const openBtn = document.getElementsByTagName("button")[0];
        const closeBtn = document.getElementsByTagName("button")[1];

        openBtn.addEventListener("click", () => {
            modal.classList.add("open");
        });

        closeBtn.addEventListener("click", () => {
            modal.classList.remove("open");
        })

        document.addEventListener("click", function(event) {
            if (modal.classList.contains("open") && !modal.querySelector('.modal-content').contains(event.target) && event.target != openBtn) {
                modal.classList.remove("open");
            }
        })
    </script>
</body>
</html>
