<!-- Create a dynamic table with add/remove row functionality -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
        <table>
            <thead>
            <tr>
                <th>Name</th>
                <th>Roll no.</th>
                <th>Branch</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
            </thead>

            <tbody>

            <tr>
                <td>Shubham</td>
                <td>2201462</td>
                <td>CSE</td>
                <td>Senior Dev</td>
                <th><button class="removeBtn">Remove</button></th>
            </tr>

            </tbody>
        </table>
    </div>

    <div>
        <button id="addBtn">Add Row</button>
    </div>

    <script>
        const tableBody = document.getElementsByTagName("tbody")[0];
        const addBtn = document.getElementById("addBtn");

        addBtn.addEventListener("click", () => {
            const tableRow = document.createElement("tr");

            tableRow.innerHTML = `
                <td><input type="text" placeholder="Enter Name"/></td>
                <td><input type="text" placeholder="Enter Roll No."/></td>
                <td><input type="text" placeholder="Enter Branch"/></td>
                <td><input type="text" placeholder="Enter Role"/></td>
                <td><button class="removeBtn">Remove</button></td>
             `;
             
            tableBody.appendChild(tableRow);  

         }) ;
         
        tableBody.addEventListener("click", (event) => {
            if(event.target.classList.contains("removeBtn")) {
                event.target.parentElement.parentElement.remove();
            }
        }) ;
    </script>
</body>
</html>
