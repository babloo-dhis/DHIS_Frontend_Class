<!-- Build a pagination component -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    #content div {
      padding: 8px;
      margin: 4px 0;
      border-bottom: 1px solid #ddd;
    }

    .pagination {
      margin-top: 20px;
    }

    .pagination button {
      margin: 0 4px;
      padding: 6px 12px;
      border: 1px solid #aaa;
      background: #f2f2f2;
      cursor: pointer;
      border-radius: 4px;
    }

    .pagination button.active {
      background-color: #007bff;
      color: white;
      font-weight: bold;
    }

    .pagination button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
    
    <div id="content"></div>
    <div id="pagination" class="pagination"></div>

    <script>
        const items = Array.from({length: 55}, (_, i) => `item #${i +1}`);

        const itemsPerPage = 10;

        let currentPage = 1;

        function renderContent(page) {
            const start = (page - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            document.getElementById('content').innerHTML = items
              .slice(start, end)
              .map(items => `<div>${items}</div>`)
              .join('');
        }

        function renderPagination() {
            const totalPages = Math.ceil(items.length/itemsPerPage);
            const container = document.getElementById('pagination');
            container.innerHTML = '';
        
        //Previous Button
        const prevBtn = document.createElement('button');
        prevBtn.textContent = 'prev';
        prevBtn.disabled = currentPage === 1;
        prevBtn.onclick = () => setPage(currentPage - 1);
        container.appendChild(prevBtn);

        //Button
        for( let i = 1; i <= totalPages; i++) {
            const btn = document.createElement('button');
            btn.textContent = i;
            if (i === currentPage) btn.classList.add('active');
            btn.onclick = () => setPage(i);
            container.appendChild(btn);

        }
        
        //next btn
        const nextBtn = document.createElement('button');
        nextBtn.textContent = 'next';
        nextBtn.disabled = currentPage === totalPages;
        nextBtn.onclick = () => setPage(currentPage + 1);
        container.appendChild(nextBtn);

        }

        function setPage(page) {
            currentPage = page;
            renderContent(page);
            renderPagination();

        }

        setPage(1);
    </script>
</body>
</html>
