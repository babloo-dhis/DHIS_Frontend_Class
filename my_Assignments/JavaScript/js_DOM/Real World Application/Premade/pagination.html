<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pagination Component Example</title>
  <style>
    .pagination {
      display: flex;
      gap: 4px;
      margin: 20px 0;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
    }
    .pagination button {
      border: none;
      background: #eee;
      padding: 8px 12px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 1rem;
      transition: background 0.2s;
    }
    .pagination button.active {
      background: #3498db;
      color: white;
      font-weight: bold;
    }
    .pagination button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div id="content"></div>
  <div class="pagination" id="pagination"></div>

  <script>
    // Example dataset (replace with actual data)
    const items = Array.from({length: 55}, (_, i) => `Item #${i + 1}`);
    const itemsPerPage = 10;
    let currentPage = 1;

    function renderContent(page) {
      const start = (page - 1) * itemsPerPage;
      const end = start + itemsPerPage;
      document.getElementById('content').innerHTML = items
        .slice(start, end)
        .map(item => `<div>${item}</div>`)
        .join('');
    }

    function renderPagination() {
      const totalPages = Math.ceil(items.length / itemsPerPage);
      const container = document.getElementById('pagination');
      container.innerHTML = '';

      // Previous button
      const prevBtn = document.createElement('button');
      prevBtn.textContent = 'Prev';
      prevBtn.disabled = currentPage === 1;
      prevBtn.onclick = () => setPage(currentPage - 1);
      container.appendChild(prevBtn);

      // Page buttons
      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => setPage(i);
        container.appendChild(btn);
      }

      // Next button
      const nextBtn = document.createElement('button');
      nextBtn.textContent = 'Next';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.onclick = () => setPage(currentPage + 1);
      container.appendChild(nextBtn);
    }

    function setPage(page) {
      currentPage = page;
      renderContent(page);
      renderPagination();
    }

    // Initialize
    setPage(1);
  </script>
</body>
</html>
