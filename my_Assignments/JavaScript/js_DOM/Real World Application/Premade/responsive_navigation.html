<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .navbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #333;
  padding: 0 20px;
}
.logo {
  color: #fff;
  font-size: 1.5rem;
  padding: 15px 0;
}
.nav-links {
  list-style: none;
  display: flex;
  margin: 0;
  padding: 0;
}
.nav-links li a {
  color: #fff;
  text-decoration: none;
  padding: 14px 16px;
  display: block;
}
.menu-toggle {
  display: none;
  color: #fff;
  font-size: 2rem;
  cursor: pointer;
}
@media (max-width: 768px) {
  .nav-links {
    position: absolute;
    top: 60px;
    right: 0;
    background: #333;
    flex-direction: column;
    width: 200px;
    display: none;
  }
  .nav-links.active {
    display: flex;
  }
  .menu-toggle {
    display: block;
  }
}

    </style>
</head>
<body>
    
    <nav class="navbar">
  <div class="logo">MyWebsite</div>
  <ul class="nav-links" id="navLinks">
    <li><a href="#">Home</a></li>
    <li><a href="#">About</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact</a></li>
  </ul>
  <div class="menu-toggle" id="menuToggle">☰</div>
</nav>


    <script>
        const menuToggle = document.getElementById("menuToggle");
const navLinks = document.getElementById("navLinks");

menuToggle.addEventListener("click", () => {
  navLinks.classList.toggle("active");
});

    </script>
</body>
</html>
